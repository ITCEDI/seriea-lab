name: Raccolta dati Serie A

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scarica storico e quote
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit dei dati aggiornati
        run: |
          git config user.name "seriea-lab bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna variazione"
          else
            git commit -m "data: aggiornamento $(date -u +%Y-%m-%d)"
            git push
          fi
